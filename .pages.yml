      - name: privacy-en
        label: "🔒 Privacidad (EN) — una política por app"
        type: collection
        path: src/content/privacy/en
        filename:
          template: "{primary}.md"
          field: create
        view:
          fields: [app, effectiveDate, example, draft]
          primary: app
        fields:
          - name: app
            type: reference
            label: "📱 App"
            description: "La política se publica en /apps/<app>/privacy/ (esa es la URL para Google Play)."
            required: true
            options:
              collection: projects-en
              value: "{name}"
              label: "{primary}"
              search: "title"
          - name: effectiveDate
            type: date
            label: "Vigente desde"
            options:
              format: yyyy-MM-dd
          - name: contactEmail
            type: string
            label: "Correo de contacto (vacío = el del sitio)"
          - name: example
            type: boolean
            label: "PLANTILLA — revisar (muestra un aviso). Desactívalo cuando la hayas revisado"
            default: true
          - name: draft
            component: draft
          - name: body
            type: rich-text
            label: "Texto de la política (cambia cada [CORCHETE])"
            options:
              format: markdown
            default: |
              > **TEMPLATE — review.** This text is a starting point, not legal advice. Adjust it to what your app actually does before submitting it to Google Play or the App Store, then delete this paragraph.

              This policy explains how **[APP NAME]** ("the app"), developed by Edwin Ramos Madera, handles its users' information.

              ## Information the app collects

              - **[Describe the data the app collects, or write: "The app does not collect personal data".]**
              - Examples: data you enter (name, email), device data (model, OS version), usage or crash data, location, photos, contacts.

              ## How it is used

              - **[E.g.: to make the app work, to sync your data, to fix bugs.]**
              - Personal data is not sold to third parties.

              ## Third-party services

              The app may use these services, which have their own privacy policies:

              - **[E.g.: Google Play Services, Firebase Crashlytics / Analytics, Firebase Cloud Messaging, AdMob — or "none".]**

              ## Where data is stored and for how long

              - **[E.g.: only on your device / on [PROVIDER] servers in [REGION].]**
              - **[How long it is kept and how it is deleted.]**

              ## Your rights

              You can request access to, correction or deletion of your data by writing to the contact email below. **[If the app has accounts: explain how to delete the account in the app or on a web page.]**

              ## Children

              **[E.g.: The app is not directed at children under 13 and does not knowingly collect data from children.]**

              ## Changes to this policy

              If this policy changes, the new version will be published here with its effective date.

              ## Contact

              If you have questions about this policy, write to the email shown on this page.
