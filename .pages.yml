# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Sign in at https://app.pagescms.org with GitHub, pick this repository and edit.
# Each save = a commit to `main` = automatic deploy via GitHub Actions (~2 min).
#
# Content lives in src/content/<collection>/<es|en>/<file>.md
# TIP: use the SAME file name in /es and /en so the ES/EN switch links the translations.

media:
  input: public/images
  output: /images

settings:
  content:
    merge: true

components:
  example:
    type: boolean
    label: "¿Es contenido de ejemplo? (muestra la etiqueta EJEMPLO)"
    description: Desactívalo cuando el contenido sea real.
    default: false
  draft:
    type: boolean
    label: Borrador (no se publica)
    default: false
  url:
    type: string
    label: URL
    pattern:
      regex: "^(https?://.*)?$"
      message: "Debe empezar con https:// (o dejarlo vacío)"

content:
  - name: group-es
    label: "🇪🇸 Español"
    type: group
    items:
      - name: projects-es
        label: "📱 Apps (ES)"
        type: collection
        path: src/content/projects/es
        filename:
          template: "{primary}.md"
          field: create
        view:
          fields: [title, status, featured, draft]
          primary: title
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            type: string
            label: Nombre de la app
            required: true
          - name: summary
            type: text
            label: "Descripción corta (1–2 frases, sale en la tarjeta)"
            required: true
          - name: status
            type: select
            label: Estado
            required: true
            default: in-development
            options:
              values:
                - { name: live, label: "Disponible (publicada en tiendas)" }
                - { name: in-development, label: "En desarrollo / beta" }
                - { name: idea, label: "Idea" }
          - name: statusLabel
            type: string
            label: "Texto del estado (opcional, ej. «Próximamente en Google Play»)"
          - name: platforms
            type: select
            label: Plataformas
            options:
              multiple: true
              values:
                - { name: android, label: "Android" }
                - { name: ios, label: "iOS" }
                - { name: web, label: "Web" }
                - { name: windows, label: "Windows" }
                - { name: macos, label: "macOS" }
          - name: logo
            type: image
            label: "Ícono de la app (imagen cuadrada, ej. 512×512)"
          - name: icon
            type: string
            label: "Ícono si no subes imagen (nombre de Material Symbols, ej. phone_android)"
          - name: screenshots
            type: image
            label: "Capturas de pantalla (verticales, de teléfono)"
            options:
              multiple: true
          - name: whatsNew
            type: text
            label: "Novedades (opcional — texto libre, ej. lo nuevo de la última versión)"
          - name: playStoreUrl
            component: url
            label: Enlace Google Play
          - name: appStoreUrl
            component: url
            label: Enlace App Store
          - name: betaUrl
            component: url
            label: "Enlace beta (Play testing / TestFlight). Vacío = formulario de beta del sitio"
          - name: websiteUrl
            component: url
            label: "Sitio web de la app (opcional)"
          - name: privacyUrl
            type: string
            label: "Política de privacidad externa (opcional, ej. /plantcare/privacy/#es). Si la llenas, se usa en vez de la sección 🔒 Privacidad"
          - name: tags
            type: string
            label: "Tecnologías (opcional)"
            list: true
          - name: featured
            type: boolean
            label: "Destacada (sale primero en la portada)"
            default: false
          - name: order
            type: number
            label: Orden (1 = primero)
            default: 10
          - name: date
            type: date
            label: Fecha
            options:
              format: yyyy-MM-dd
          - name: example
            component: example
          - name: draft
            component: draft
          - name: body
            type: rich-text
            label: "Sobre la app (qué hace, para quién)"
            options:
              format: markdown
      - name: privacy-es
        label: "🔒 Privacidad (ES) — una política por app"
        type: collection
        path: src/content/privacy/es
        filename:
          template: "{primary}.md"
          field: create
        view:
          fields: [app, effectiveDate, example, draft]
          primary: app
        fields:
          - name: app
            type: reference
            label: "📱 App"
            description: "La política se publica en /apps/<app>/privacy/ (esa es la URL para Google Play)."
            required: true
            options:
              collection: projects-es
              value: "{name}"
              label: "{primary}"
              search: "title"
          - name: effectiveDate
            type: date
            label: "Vigente desde"
            options:
              format: yyyy-MM-dd
          - name: contactEmail
            type: string
            label: "Correo de contacto (vacío = el del sitio)"
          - name: example
            type: boolean
            label: "PLANTILLA — revisar (muestra un aviso). Desactívalo cuando la hayas revisado"
            default: true
          - name: draft
            component: draft
          - name: body
            type: rich-text
            label: "Texto de la política (cambia cada [CORCHETE])"
            options:
              format: markdown
            default: |
              > **PLANTILLA — revisar.** Este texto es un punto de partida, no asesoría legal. Ajústalo a lo que tu app hace realmente antes de enviarla a Google Play o App Store, y borra este párrafo al terminar.

              Esta política explica cómo **[NOMBRE DE LA APP]** («la app»), desarrollada por Edwin Ramos Madera, trata la información de sus usuarios.

              ## Información que recopila la app

              - **[Describe los datos que la app recopila, o escribe: «La app no recopila datos personales».]**
              - Ejemplos: datos que introduces tú (nombre, correo), datos del dispositivo (modelo, versión del sistema), datos de uso o de fallos, ubicación, fotos, contactos.

              ## Para qué se usa

              - **[Ej.: para que la app funcione, para sincronizar tus datos, para corregir errores.]**
              - No se venden datos personales a terceros.

              ## Servicios de terceros

              La app puede usar estos servicios, que tienen sus propias políticas de privacidad:

              - **[Ej.: Google Play Services, Firebase Crashlytics / Analytics, Firebase Cloud Messaging, AdMob — o «ninguno».]**

              ## Dónde se guardan los datos y por cuánto tiempo

              - **[Ej.: solo en tu dispositivo / en servidores de [PROVEEDOR] en [REGIÓN].]**
              - **[Cuánto tiempo se conservan y cómo se eliminan.]**

              ## Tus derechos

              Puedes pedir acceso, corrección o eliminación de tus datos escribiendo al correo de contacto de abajo. **[Si la app tiene cuentas: explica cómo borrar la cuenta desde la app o desde una página web.]**

              ## Menores de edad

              **[Ej.: La app no está dirigida a menores de 13 años y no recopila conscientemente datos de menores.]**

              ## Cambios en esta política

              Si esta política cambia, se publicará aquí la nueva versión con su fecha de entrada en vigor.

              ## Contacto

              Si tienes preguntas sobre esta política, escribe al correo indicado en esta página.
      - name: profile-es
        label: "👤 Inicio / Sobre mí (ES)"
        type: file
        path: src/content/profile/es.md
        fields:
          - name: role
            type: string
            label: Título profesional
          - name: intro
            type: text
            label: "Presentación en la portada (1–2 líneas)"
          - name: location
            type: string
            label: Ubicación
          - name: body
            type: rich-text
            label: "Sobre mí (párrafo corto en la portada)"
            options:
              format: markdown
